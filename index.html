<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文能力檢定｜Basic ・ YLE Starters ・ Movers ・ Flyers</title>
<style>
  :root{--paper:#fdfaf3;--ink:#2f2921;--line:#e0d4bd;--soft:#8d8271;
        --gold:#e0a83c;--green:#3f9a63;--red:#d9534f;--blue:#4a7fc1;--sky:#dff0fa;}
  *{box-sizing:border-box;}
  body{margin:0;padding:14px;background:#24211b;color:var(--ink);
       font-family:"Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;}
  .wrap{max-width:680px;margin:0 auto;background:var(--paper);border-radius:18px;
        padding:20px 20px 26px;box-shadow:0 16px 36px rgba(0,0,0,.45);}
  h1{margin:0 0 2px;text-align:center;font-size:clamp(19px,4.4vw,25px);font-weight:800;}
  .sub{text-align:center;font-size:13px;color:var(--soft);margin-bottom:18px;}

  /* 首頁選單 */
  .levels{display:flex;flex-direction:column;gap:12px;}
  .lvl{display:flex;gap:14px;align-items:center;text-align:left;width:100%;cursor:pointer;
       background:#fff;border:3px solid var(--line);border-radius:16px;padding:15px 16px;
       font-family:inherit;color:var(--ink);transition:.14s;}
  .lvl:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.08);}
  .lvl .ico{font-size:38px;flex:0 0 46px;text-align:center;}
  .lvl .t{font-size:18px;font-weight:800;}
  .lvl .d{font-size:13px;color:var(--soft);line-height:1.6;margin-top:2px;}
  .lvl .m{font-size:12.5px;color:var(--blue);font-weight:700;margin-top:4px;}
  .note{margin-top:18px;background:#f4ecdb;border:2.5px dashed var(--gold);border-radius:12px;
        padding:12px 14px;font-size:13.5px;line-height:1.9;}

  /* 單元選單 */
  .parts{display:flex;flex-direction:column;gap:9px;}
  .prt{display:flex;gap:12px;align-items:center;width:100%;cursor:pointer;text-align:left;
       background:#fff;border:2.5px solid var(--line);border-radius:13px;padding:12px 14px;
       font-family:inherit;color:var(--ink);transition:.12s;}
  .prt:hover{border-color:var(--gold);transform:translateX(4px);}
  .prt .n{flex:0 0 34px;height:34px;border-radius:50%;background:#f0e7d6;display:flex;
          align-items:center;justify-content:center;font-weight:800;font-size:15px;}
  .prt .t{font-size:16px;font-weight:700;}
  .prt .s{font-size:12.5px;color:var(--soft);margin-top:1px;}
  .prt .sc{margin-left:auto;flex:0 0 auto;font-size:13px;font-weight:800;color:var(--green);}
  .prt.done{border-color:var(--green);background:#f3fbf5;}
  .prt.done .n{background:var(--green);color:#fff;}

  .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-bottom:6px;}
  .bar{height:9px;background:#eee4d2;border-radius:99px;overflow:hidden;}
  .bar>i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s;}
  .partbox{margin-top:15px;background:#f4ecdb;border-radius:12px;padding:10px 14px;
           font-size:14px;line-height:1.7;border-left:5px solid var(--gold);}
  .partbox b{display:block;font-size:14.5px;}
  .partbox i{font-style:normal;color:var(--soft);font-size:13px;}

  .scene{margin-top:13px;background:var(--sky);border:2.5px solid var(--line);border-radius:14px;
         padding:14px;position:relative;min-height:150px;overflow:hidden;}
  .scene.park{background:linear-gradient(#dff0fa 0 58%,#cdeab0 58% 100%);}
  .scene .e{position:absolute;line-height:1;}
  .panels{display:flex;gap:8px;margin-top:13px;}
  .panel{flex:1;background:var(--sky);border:2.5px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;}
  .panel .pics{font-size:29px;line-height:1.5;}
  .panel .cap{font-size:12px;line-height:1.55;margin-top:6px;font-family:Georgia,serif;}
  .textbox{background:#fff;border:2.5px solid var(--line);border-radius:12px;padding:12px 14px;
           font-family:Georgia,serif;font-size:16px;line-height:2;margin-top:13px;}
  .wordbank{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:9px;}
  .wordbank span{background:#f4ecdb;border:2px dashed var(--gold);border-radius:8px;
                 padding:5px 11px;font-family:Georgia,serif;font-size:15px;}
  .dialog{background:#fff;border:2.5px solid var(--line);border-radius:12px;padding:12px 14px;
          font-family:Georgia,serif;font-size:17px;line-height:1.9;margin-bottom:12px;}
  .dialog b{color:var(--blue);}
  .blank{color:var(--blue);letter-spacing:2px;}

  .card{margin-top:15px;}
  .qno{font-size:13px;color:var(--soft);}
  .bigpic{font-size:60px;text-align:center;line-height:1.25;margin:6px 0;}
  .qtext{font-size:clamp(17px,4vw,23px);line-height:1.7;margin:6px 0 14px;
         font-family:Georgia,"Times New Roman",serif;}
  .scramble{text-align:center;font-size:clamp(23px,5.6vw,32px);letter-spacing:12px;
            font-family:Georgia,serif;color:var(--blue);margin-bottom:12px;}

  .opts{display:flex;flex-direction:column;gap:9px;}
  .opts.two{flex-direction:row;}
  .opts.two button{flex:1;justify-content:center;font-size:24px;}
  button.opt{font-family:inherit;text-align:left;cursor:pointer;width:100%;background:#fff;
             border:2.5px solid var(--line);border-radius:12px;padding:12px 14px;
             font-size:clamp(15px,3.3vw,19px);color:var(--ink);display:flex;align-items:center;gap:11px;transition:.12s;}
  button.opt .k{flex:0 0 28px;height:28px;border-radius:50%;background:#f0e7d6;display:flex;
                align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  button.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(3px);}
  button.opt:disabled{cursor:default;}
  button.opt.ok{border-color:var(--green);background:#eaf6ee;}
  button.opt.ok .k{background:var(--green);color:#fff;}
  button.opt.no{border-color:var(--red);background:#fdeeed;opacity:.8;}
  button.opt.no .k{background:var(--red);color:#fff;}

  .inputrow{display:flex;gap:8px;}
  .inputrow input{flex:1;font-family:Georgia,serif;font-size:21px;padding:11px 14px;
                  border:2.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);}
  .inputrow input:focus{outline:none;border-color:var(--gold);}
  .inputrow input.ok{border-color:var(--green);background:#eaf6ee;}
  .inputrow input.no{border-color:var(--red);background:#fdeeed;}

  .hint{margin-top:13px;padding:12px 14px;border-radius:12px;display:none;font-size:15px;line-height:1.85;}
  .hint.show{display:block;}
  .hint.good{background:#eaf6ee;border:2.5px solid var(--green);}
  .hint.bad{background:#fff5e2;border:2.5px solid var(--gold);}
  .hint b{color:var(--blue);}

  .row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
  button.act{font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;padding:11px 24px;
             border-radius:99px;border:2.5px solid var(--ink);background:var(--gold);color:#2f2921;transition:.12s;}
  button.act:hover{transform:translateY(-2px);background:#ecbb5c;}
  button.act.ghost{background:#fff;}
  .hide{display:none !important;}

  .result{text-align:center;}
  .shields{font-size:30px;letter-spacing:4px;margin:6px 0;}
  .score{font-size:clamp(34px,9vw,56px);font-weight:900;margin:2px 0;line-height:1.1;}
  .score small{font-size:.4em;color:var(--soft);}
  .comment{font-size:15px;color:var(--soft);margin-bottom:10px;line-height:1.8;}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0;}
  .cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;
        justify-content:center;font-weight:800;font-size:14px;border:2.5px solid var(--line);background:#fff;}
  .cell.ok{border-color:var(--green);background:#eaf6ee;color:var(--green);}
  .cell.no{border-color:var(--red);background:#fdeeed;color:var(--red);}
  .cell span{font-size:10px;font-weight:600;color:var(--soft);}
  .final-list{text-align:left;font-size:15px;line-height:2;display:inline-block;}
  .backrow{text-align:center;margin-top:14px;}
  .backrow button{background:none;border:none;color:var(--soft);font-family:inherit;
                  font-size:13px;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">📚 英文能力檢定</h1>
  <div class="sub" id="pageSub">選一個程度開始練習</div>

  <!-- 首頁 -->
  <div id="homeBox">
    <div class="levels" id="levelList"></div>
    <div class="note">
      <b>測驗方式</b><br>
      ・每 <b>10 題</b>結算一次分數，每題 10 分<br>
      ・答錯的題目可以立刻<b>訂正</b>，訂正時選錯會馬上看到正確答案和說明<br>
      ・YLE 三個級別依照劍橋官方規定的題數設計，做完會換算<b>盾牌</b>（最多 5 個）<br>
      ・題目全部原創，僅模仿官方題型，未使用官方考古題
    </div>
  </div>

  <!-- 單元選單（Basic 專用） -->
  <div id="partBox" class="hide">
    <div class="parts" id="partList"></div>
    <div class="row"><button class="act ghost" id="allBtn">📖 全部 100 題依序做</button></div>
    <div class="backrow"><button id="quitBtn0">← 回到程度選單</button></div>
  </div>

  <!-- 作答 -->
  <div id="quizBox" class="hide">
    <div class="meta"><span id="blockLabel"></span><span id="countLabel"></span></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="partbox" id="partbox"></div>
    <div id="visual"></div>
    <div class="card">
      <div class="qno" id="qno"></div>
      <div id="qbody"></div>
      <div id="answerArea"></div>
      <div class="hint" id="hint"></div>
      <div class="row"><button class="act hide" id="nextBtn">下一題 ▶</button></div>
    </div>
    <div class="backrow"><button id="quitBtn">← 回到選單</button></div>
  </div>

  <!-- 每 10 題成績 -->
  <div id="resultBox" class="hide result">
    <div id="blockDone" style="font-size:17px;font-weight:800;"></div>
    <div class="score" id="scoreText"></div>
    <div class="comment" id="comment"></div>
    <div class="grid" id="grid"></div>
    <div class="row" id="resultRow"></div>
    <div class="backrow"><button id="quitBtn2">← 回到選單</button></div>
  </div>

  <!-- 總成績 -->
  <div id="finalBox" class="hide result">
    <div style="font-size:19px;font-weight:900;">🎉 全部完成！</div>
    <div class="shields" id="finalShields"></div>
    <div class="score" id="finalScore"></div>
    <div class="final-list" id="finalList"></div>
    <div class="row">
      <button class="act" id="againBtn">🔁 再測一次</button>
      <button class="act ghost hide" id="backPartBtn">回到單元選單</button>
      <button class="act ghost" id="homeBtn">回到程度選單</button>
    </div>
  </div>
</div>

<script>
const LEVELS = [{"id": "basic", "title": "Basic 基礎文法", "icon": "📗", "desc": "be 動詞、助動詞、形容詞、現在進行式、冠詞單複數、介系詞", "meta": "10 個單元 × 10 題　共 100 題", "shield": false, "parts": true, "items": [{"part": "Basic Part 1｜be 動詞 am / is / are", "q": "I ___ a student.", "type": "mcq", "o": ["am", "is", "are"], "a": 0, "e": "主詞 I 一定配 am。"}, {"part": "Basic Part 1｜be 動詞 am / is / are", "q": "She ___ my sister.", "type": "mcq", "o": ["am", "is", "are"], "a": 1, "e": "She 是第三人稱單數，配 is。"}, {"part": "Basic Part 1｜be 動詞 am / is / are", "q": "The apples ___ red.", "type": "mcq", "o": ["am", "is", "are"], "a": 2, "e": "apples 是複數，配 are。"}, {"part": "Basic Part 1｜be 動詞 am / is / are", "q": "We ___ happy today.", "type": "mcq", "o": ["am", "is", "are"], "a": 2, "e": "We 是複數，配 are。"}, {"part": "Basic Part 1｜be 動詞 am / is / are", "q": "The cat ___ on the box.", "type": "mcq", "o": ["am", "is", "are"], "a": 1, "e": "The cat 是單數，配 is。"}, {"part": "Basic Part 1｜be 動詞 am / is / are", "q": "You ___ my friend.", "type": "mcq", "o": ["am", "is", "are"], "a": 2, "e": "You 不管單複數都配 are。"}, {"part": "Basic Part 1｜be 動詞 am / is / are", "q": "Tom and I ___ in the park.", "type": "mcq", "o": ["am", "is", "are"], "a": 2, "e": "Tom and I 是兩個人，配 are。"}, {"part": "Basic Part 1｜be 動詞 am / is / are", "q": "It ___ a big elephant.", "type": "mcq", "o": ["am", "is", "are"], "a": 1, "e": "It 是單數，配 is。"}, {"part": "Basic Part 1｜be 動詞 am / is / are", "q": "My brother ___ six years old.", "type": "mcq", "o": ["am", "is", "are"], "a": 1, "e": "My brother 是單數，配 is。"}, {"part": "Basic Part 1｜be 動詞 am / is / are", "q": "They ___ my classmates.", "type": "mcq", "o": ["am", "is", "are"], "a": 2, "e": "They 是複數，配 are。"}, {"part": "Basic Part 2｜be 動詞的否定與疑問", "q": "___ you a teacher?", "type": "mcq", "o": ["Am", "Is", "Are"], "a": 2, "e": "問 you 的時候，be 動詞用 Are 放句首。"}, {"part": "Basic Part 2｜be 動詞的否定與疑問", "q": "___ she your mother?", "type": "mcq", "o": ["Am", "Is", "Are"], "a": 1, "e": "she 是第三人稱單數，用 Is 開頭。"}, {"part": "Basic Part 2｜be 動詞的否定與疑問", "q": "I ___ not hungry.", "type": "mcq", "o": ["am", "is", "are"], "a": 0, "e": "I 的否定是 I am not。"}, {"part": "Basic Part 2｜be 動詞的否定與疑問", "q": "He ___ not at home.", "type": "mcq", "o": ["am", "is", "are"], "a": 1, "e": "He 配 is，否定是 is not。"}, {"part": "Basic Part 2｜be 動詞的否定與疑問", "q": "They ___ not ready.", "type": "mcq", "o": ["am", "is", "are"], "a": 2, "e": "They 配 are，否定是 are not。"}, {"part": "Basic Part 2｜be 動詞的否定與疑問", "q": "___ it cold today?", "type": "mcq", "o": ["Am", "Is", "Are"], "a": 1, "e": "it 是單數，用 Is 開頭。"}, {"part": "Basic Part 2｜be 動詞的否定與疑問", "q": "___ they in the classroom?", "type": "mcq", "o": ["Am", "Is", "Are"], "a": 2, "e": "they 是複數，用 Are 開頭。"}, {"part": "Basic Part 2｜be 動詞的否定與疑問", "q": "She ___ a doctor. She is a nurse.", "type": "mcq", "o": ["amn't", "isn't", "aren't"], "a": 1, "e": "She 的否定縮寫是 isn't。"}, {"part": "Basic Part 2｜be 動詞的否定與疑問", "q": "We ___ late. We are early.", "type": "mcq", "o": ["isn't", "aren't", "amn't"], "a": 1, "e": "We 的否定縮寫是 aren't。"}, {"part": "Basic Part 2｜be 動詞的否定與疑問", "q": "___ I right?", "type": "mcq", "o": ["Am", "Is", "Are"], "a": 0, "e": "問 I 的時候用 Am 開頭。"}, {"part": "Basic Part 3｜助動詞 do / does", "q": "___ you like bananas?", "type": "mcq", "o": ["Do", "Does", "Is"], "a": 0, "e": "主詞 you 的疑問句用 Do。"}, {"part": "Basic Part 3｜助動詞 do / does", "q": "___ he play basketball?", "type": "mcq", "o": ["Do", "Does", "Are"], "a": 1, "e": "he 是第三人稱單數，用 Does。"}, {"part": "Basic Part 3｜助動詞 do / does", "q": "They ___ not like carrots.", "type": "mcq", "o": ["do", "does", "is"], "a": 0, "e": "They 是複數，否定用 do not。"}, {"part": "Basic Part 3｜助動詞 do / does", "q": "___ the bus come at eight?", "type": "mcq", "o": ["Do", "Does", "Is"], "a": 1, "e": "The bus 是單數，用 Does。"}, {"part": "Basic Part 3｜助動詞 do / does", "q": "We ___ go to school on Sunday.", "type": "mcq", "o": ["don't", "doesn't", "isn't"], "a": 0, "e": "We 是複數，否定用 don't。"}, {"part": "Basic Part 3｜助動詞 do / does", "q": "She ___ not eat meat.", "type": "mcq", "o": ["do", "does", "is"], "a": 1, "e": "She 是第三人稱單數，否定用 does not。"}, {"part": "Basic Part 3｜助動詞 do / does", "q": "___ your parents work here?", "type": "mcq", "o": ["Do", "Does", "Is"], "a": 0, "e": "parents 是複數，用 Do。"}, {"part": "Basic Part 3｜助動詞 do / does", "q": "___ Anna have a dog?", "type": "mcq", "o": ["Do", "Does", "Are"], "a": 1, "e": "Anna 是一個人，用 Does。"}, {"part": "Basic Part 3｜助動詞 do / does", "q": "I ___ not know his name.", "type": "mcq", "o": ["do", "does", "am"], "a": 0, "e": "I 的否定用 do not。"}, {"part": "Basic Part 3｜助動詞 do / does", "q": "___ it rain a lot here?", "type": "mcq", "o": ["Do", "Does", "Are"], "a": 1, "e": "it 是單數，用 Does。"}, {"part": "Basic Part 4｜can 與 have got", "q": "I ___ swim very well.", "type": "mcq", "o": ["can", "cans", "to can"], "a": 0, "e": "can 是助動詞，永遠不加 s。"}, {"part": "Basic Part 4｜can 與 have got", "q": "She ___ got a new bike.", "type": "mcq", "o": ["have", "has", "is"], "a": 1, "e": "She 是第三人稱單數，用 has got。"}, {"part": "Basic Part 4｜can 與 have got", "q": "They ___ got two cats.", "type": "mcq", "o": ["have", "has", "is"], "a": 0, "e": "They 是複數，用 have got。"}, {"part": "Basic Part 4｜can 與 have got", "q": "___ you swim?", "type": "mcq", "o": ["Do", "Can", "Are"], "a": 1, "e": "問「會不會」用 Can 開頭。"}, {"part": "Basic Part 4｜can 與 have got", "q": "He ___ ride a bike. He is too young.", "type": "mcq", "o": ["can't", "doesn't", "isn't"], "a": 0, "e": "can 的否定是 can't。"}, {"part": "Basic Part 4｜can 與 have got", "q": "We ___ got a big garden.", "type": "mcq", "o": ["have", "has", "are"], "a": 0, "e": "We 是複數，用 have got。"}, {"part": "Basic Part 4｜can 與 have got", "q": "___ she got a sister?", "type": "mcq", "o": ["Have", "Has", "Is"], "a": 1, "e": "she 用 Has got。"}, {"part": "Basic Part 4｜can 與 have got", "q": "Birds ___ fly.", "type": "mcq", "o": ["can", "cans", "are"], "a": 0, "e": "can 後面直接接原形動詞。"}, {"part": "Basic Part 4｜can 與 have got", "q": "I ___ got a headache.", "type": "mcq", "o": ["have", "has", "am"], "a": 0, "e": "I 用 have got。" t?<br><b>Kim:</b> Eight books!"}, {"part": "Starters Listening Part 2｜Read and choose the name or number.", "q": "How old is Sam's sister?", "type": "mcq", "o": ["nine", "ten", "eleven"], "a": 0, "e": "Sam 說 She's nine。", "dialog": "<b>Girl:</b> How old is your sister?<br><b>Sam:</b> She's nine."}, {"part": "Starters Listening Part 3｜Read and choose the right thing.", "q": "What is Ben eating?", "type": "mcq", "o": ["an apple", "a banana", "an orange"], "a": 1, "e": "Ben 說 a banana。", "dialog": "<b>Mum:</b> What are you eating, Ben?<br><b>Ben:</b> I'm eating a banana.", "hint": "讀對話，選出對的東西。"}, {"part": "Starters Listening Part 3｜Read and choose the right thing.", "q": "What is the weather like?", "type": "mcq", "o": ["sunny", "raining", "snowing"], "a": 1, "e": "媽媽說 it's raining。", "dialog": "<b>Boy:</b> Can we play outside?<br><b>Mum:</b> No, it's raining today."}, {"part": "Starters Listening Part 3｜Read and choose the right thing.", "q": "What does Kim want?", "type": "mcq", "o": ["a kite", "a doll", "a bike"], "a": 0, "e": "Kim 說 a new kite。", "dialog": "<b>Dad:</b> What do you want for your birthday?<br><b>Kim:</b> I want a new kite!"}, {"part": "Starters Listening Part 3｜Read and choose the right thing.", "q": "How does Tom go to school?", "type": "mcq", "o": ["by car", "by bus", "by train"], "a": 1, "e": "Tom 說 by bus。", "dialog": "<b>Girl:</b> How do you go to school?<br><b>Tom:</b> I go by bus."}, {"part": "Starters Listening Part 3｜Read and choose the right thing.", "q": "What pet has Anna got?", "type": "mcq", "o": ["a cat", "a bird", "a dog"], "a": 2, "e": "Anna 說 a small dog。", "dialog": "<b>Boy:</b> Have you got a pet?<br><b>Anna:</b> Yes, I've got a small dog."}, {"part": "Starters Listening Part 4｜Read and choose.", "q": "What does the boy want?", "type": "mcq", "o": ["water", "milk", "juice"], "a": 0, "e": "男孩說 some water。", "dialog": "<b>Boy:</b> I'm thirsty. Can I have some water, please?", "hint": "讀句子，選出正確答案。"}, {"part": "Starters Listening Part 4｜Read and choose.", "q": "What is Kim's favourite colour?", "type": "mcq", "o": ["pink", "purple", "blue"], "a": 1, "e": "Kim 說 purple。", "dialog": "<b>Kim:</b> My favourite colour is purple."}, {"part": "Starters Listening Part 4｜Read and choose.", "q": "What must the child put on?", "type": "mcq", "o": ["a hat", "gloves", "shoes"], "a": 2, "e": "媽媽說 Put your shoes on。", "dialog": "<b>Mum:</b> It's cold outside. Put your shoes on!"}, {"part": "Starters Listening Part 4｜Read and choose.", "q": "When is the party?", "type": "mcq", "o": ["on Sunday", "on Monday", "on Friday"], "a": 1, "e": "爸爸說 on Monday。", "dialog": "<b>Dad:</b> Don't forget — the party is on Monday."}, {"part": "Starters Listening Part 4｜Read and choose.", "q": "What does Kim like doing?", "type": "mcq", "o": ["swimming", "playing football", "reading"], "a": 1, "e": "Kim 說 playing football。", "dialog": "<b>Kim:</b> I love playing football with my brother."}]}, {"id": "movers", "title": "YLE A1 Movers", "icon": "🥈", "desc": "劍橋兒童英語認證 第二級｜7–9 歲", "meta": "閱讀寫作 35 題 ＋ 聽力 25 題　共 60 題", "shield": true, "items": [{"part": "Movers R&W Part 1｜Read the description and choose the word.", "q": "This person helps people who aren't well in hospital.", "type": "mcq", "o": ["a nurse", "a driver", "a farmer"], "a": 0, "e": "在醫院照顧病人的是 nurse（護士）。", "hint": "讀敘述，選出正確的單字。"}, {"part": "Movers R&W Part 1｜Read the description and choose the word.", "q": "You put this on your head before you ride your bike.", "type": "mcq", "o": ["a helmet", "a scarf", "a towel"], "a": 0, "e": "騎車戴在頭上的是 helmet（安全帽）。"}, {"part": "Movers R&W Part 1｜Read the description and choose the word.", "q": "This animal is black and white and lives in the mountains.", "type": "mcq", "o": ["a dolphin", "a panda", "a kangaroo"], "a": 1, "e": "黑白色、住在山上的是 panda（貓熊）。"}, {"part": "Movers R&W Part 1｜Read the description and choose the word.", "q": "You can walk up and down these inside a house.", "type": "mcq", "o": ["stairs", "lifts", "shelves"], "a": 0, " ", "scene": "\n<div class=\"textbox\"><b>Sam's Lost Cat</b><br>\nOn Monday morning, Sam couldn't find his cat, Tiger. He looked under his bed and behind\nthe sofa, but Tiger wasn't there. Sam's sister Kate helped him look in the garden.\nThey looked in the tree and under the flowers. Then they heard a small noise\nfrom the garage. Tiger was sleeping inside an old box! Sam was very happy and gave\nTiger some milk.</div>", "hint": "讀故事，回答問題。"}, {"part": "Movers R&W Part 5｜Read the story and answer.", "q": "Who helped Sam look for the cat?", "type": "mcq", "o": ["his mother", "his sister", "his teacher"], "a": 1, "e": "Sam's sister Kate helped him。", "scene": "\n<div class=\"textbox\"><b>Sam's Lost Cat</b><br>\nOn Monday morning, Sam couldn't find his cat, Tiger. He looked under his bed and behind\nthe sofa, but Tiger wasn't there. Sam's sister Kate helped him look in the garden.\nThey looked in the tree and under the flowers. Then they heard a small noise\nfrom the garage. Tiger was sleeping inside an old box! Sam was very happy and gave\nTiger some milk.</div>"}, {"part": "Movers R&W Part 5｜Read the story and answer.", "q": "Where did they look first?", "type": "mcq", "o": ["in the garden", "under the bed", "in the garage"], "a": 1, "e": "他先 looked under his bed。", "scene": "\n<div class=\"textbox\"><b>Sam's Lost Cat</b><br>\nOn Monday morning, Sam couldn't find his cat, Tiger. He looked under his bed and behind\nthe sofa, but Tiger wasn't there. Sam's sister Kate helped him look in the garden.\nThey looked in the tree and under the flowers. Then they heard a small noise\nfrom the garage. Tiger was sleeping inside an old box! Sam was very happy and gave\nTiger some milk.</div>"}, {"part": "Movers R&W Part 5｜Read the story and answer.", "q": "Where was the cat?", "type": "mcq", "o": ["in the tree", "in the garage", "under the flowers"], "a": 1, "e": "貓在 garage 的舊箱子裡。", "scene": "\n<div class=\"textbox\"><b>Sam's Lost Cat</b><br>\nOn Monday morning, Sam couldn't find h  small noise\nfrom the garage. Tiger was sleeping inside an old box! Sam was very happy and gave\nTiger some milk.</div>"}, {"part": "Movers R&W Part 6｜Look and write.", "q": "The boy is riding a ___.", "type": "input", "ans": ["bike", "bicycle"], "e": "圖中的男孩在騎腳踏車 bike。", "pic": "🧒🚲", "hint": "看圖片，寫出正確的英文字。"}, {"part": "Movers R&W Part 6｜Look and write.", "q": "The girl is eating an ___.", "type": "input", "ans": ["apple"], "e": "她在吃蘋果 apple。", "pic": "👧🍎"}, {"part": "Movers R&W Part 6｜Look and write.", "q": "There are two ___ in the sky.", "type": "input", "ans": ["birds"], "e": "天上有兩隻鳥，要用複數 birds。", "pic": "🐦🐦☁️"}, {"part": "Movers R&W Part 6｜Look and write.", "q": "The man is driving a ___.", "type": "input", "ans": ["car"], "e": "他在開車 car。", "pic": "👨🚗"}, {"part": "Movers R&W Part 6｜Look and write.", "q": "Where is the cat?", "type": "mcq", "o": ["on the table", "under the table", "behind the table"], "a": 1, "e": "貓在桌子下面 under the table。", "pic": "🪑🐈"}, {"part": "Movers R&W Part 6｜Look and write.", "q": "What is the weather like?", "type": "mcq", "o": ["It's sunny.", "It's snowing.", "It's raining."], "a": 2, "e": "圖中在下雨 raining。", "pic": "🌧️☔"}, {"part": "Movers Listening Part 1｜Read and match.", "q": "Who is Sally?", "type": "mcq", "o": ["the girl with the long hair", "the girl with the cat", "the boy on the bike"], "a": 1, "e": "對話說 Sally 抱著貓。", "dialog": "<b>Boy:</b> Which one is Sally?<br><b>Girl:</b> She's the one holding the cat.", "hint": "讀對話，找出正確的人。"}, {"part": "Movers Listening Part 1｜Read and match.", "q": "What is Tom doing?", "type": "mcq", "o": ["reading", "running", "swimming"], "a": 2, "e": "Tom 在游泳池裡游泳。", "dialog": "<b>Girl:</b> Where's Tom?<br><b>Boy:</b> He's in the pool. He's swimming."}, {"part": "Movers Listening Part 1｜Read and match.", "q": "Who is wearing glasses?", "type": "mcq", "o": ["Peter", "Anna", "Grandpa"], "a": 2, "e": "說 Grandpa 戴眼鏡。", "dialog": "<b>Anna:</b> Who's wearing the glasses?<br><b>Peter:</b> That's my grandpa."}, {"part": "Movers Listening Part 1｜Read and match.", "q": "Where is Kate standing?", "type": "mcq", "o": ["next to the tree", "behind the car", "near the door"], "a": 0, "e": "Kate 站在樹旁邊。", "dialog": "<b>Mum:</b> Can you see Kate?<br><b>Dad:</b> Yes, she's standing next to the tree."}, {"part": "Movers Listening Part 1｜Read and match.", "q": "What has Bill got?", "type": "mcq", "o": ["a kite", "a ball", "a camera"], "a": 2, "e": "Bill 拿著相機。", "dialog": "<b>Girl:</b> What's Bill holding?<br><b>Boy:</b> A camera. He loves taking photos."}, {"part": "Movers Listening Part 2｜Read and write the number or name.", "q": "How old is Jane's brother?", "type": "mcq", "o": ["nine", "ten", "twelve"], "a": 1, "e": "Jane 說 he's ten。", "dialog": "<b>Man:</b> How old is your brother, Jane?<br><b>Jane:</b> He's ten.", "hint": "注意對話中的數字、名字或拼字。"}, {"part": "Movers Listening Part 2｜Read and write the number or name.", "q": "What is the teacher's name?", "type": "mcq", "o": ["Mr Field", "Mr Green", "Mr Ford"], "a": 0, "e": "老師說 Field，F-I-E-L-D。", "dialog": "<b>Boy:</b> What's your name?<br><b>Teacher:</b> Field. F-I-E-L-D."}, {"part": "Movers Listening Part 2｜Read and write the number or name.", "q": "How much was the ticket?", "type": "mcq", "o": ["five pounds", "nine pounds", "fifteen pounds"], "a": 2, "e": "票價是 fifteen pounds。", "dialog": "<b>Girl:</b> How much was your ticket?<br><b>Boy:</b> Fifteen pounds."}, {"part": "Movers Listening Part 2｜Read and write the number or name.", "q": "What time does the film start?", "type": "mcq", "o": ["at six", "at seven", "at half past seven"], "a": 2, "e": "電影 half past seven 開始。", "dialog": "<b>Dad:</b> When does the film start?<br><b>Ben:</b> At half past seven."}, {"part": "Movers Listening Part 2｜Read and write the number or name.", "q": "Where does Sue live?", "type": "mcq", "o": ["in Bridge Street", "in Green Street", "in Park Street"], "a": 0, "e": "Sue 住在 Bridge Street。", "dialog": "<b>Man:</b> Where do you live, Sue?<br><b>Sue:</b> In Bridge Street."}, {"part": "Movers Listening Part 3｜Read and match.", "q": "What did Jack do on Monday?", "type": "mcq", "o": ["played tennis", "went swimming", "rode his bike"], "a": 1, "e": "Jack 說星期一去游泳。", "dialog": "<b>Mum:</b> What did you do on Monday?<br><b>Jack:</b> I went swimming.", "hint": "讀對話，把活動和日子配對。"}, {"part": "Movers Listening Part 3｜Read and match.", "q": "What did Jack do on Tuesday?", "type": "mcq", "o": ["played tennis", "watched TV", "went shopping"], "a": 0, "e": "星期二打網球。", "dialog": "<b>Mum:</b> And on Tuesday?<br><b>Jack:</b> I played tennis with Dad."}, {"part": "Movers Listening Part 3｜Read and match.", "q": "What did Jack do on Wednesday?", "type": "mcq", "o": ["went to the zoo", "read a book", "made a cake"], "a": 2, "e": "星期三做蛋糕。", "dialog": "<b>Mum:</b> What about Wednesday?<br><b>Jack:</b> I made a cake with Grandma."}, {"part": "Movers Listening Part 3｜Read and match.", "q": "What did Jack do on Thursday?", "type": "mcq", "o": ["went to the zoo", "played football", "cleaned his room"], "a": 0, "e": "星期四去動物園。", "dialog": "<b>Mum:</b> And Thursday?<br><b>Jack:</b> We went to the zoo!"}, {"part": "Movers Listening Part 3｜Read and match.", "q": "What did Jack do on Friday?", "type": "mcq", "o": ["went swimming", "watched a film", "played tennis"], "a": 1, "e": "星期五看電影。", "dialog": "<b>Mum:</b> And on Friday?<br><b>Jack:</b> I watched a film at home."}, {"part": "Movers Listening Part 4｜Read and choose the picture.", "q": "What is the girl going to buy?", "type": "mcq", "o": ["a scarf", "a jacket", "some gloves"], "a": 1, "e": "她決定買外套 jacket。", "dialog": "<b>Shop lady:</b> Can I help you?<br><b>Girl:</b> Yes, I'd like that blue jacket, please.", "hint": "讀對話，選出正確的東西。"}, {"part": "Movers Listening Part 4｜Read and choose the picture.", "q": "What did they see at the zoo?", "type": "mcq", "o": ["a giraffe", "a panda", "a crocodile"], "a": 2, "e": "他們看到鱷魚 crocodile。", "dialog": "<b>Boy:</b> What was your favourite animal?<br><b>Girl:</b> The crocodile! It was huge."}, {"part": "Movers Listening Part 4｜Read and choose the picture.", "q": "Where are they going?", "type": "mcq", "o": ["to the beach", "to the mountains", "to the cinema"], "a": 0, "e": "他們要去海邊 beach。", "dialog": "<b>Dad:</b> Get your swimsuit!<br><b>Boy:</b> Great — we're going to the beach!"}, {"part": "Movers Listening Part 4｜Read and choose the picture.", "q": "What is wrong with Anna?", "type": "mcq", "o": ["She has a cold.", "She has a headache.", "She has a toothache."], "a": 1, "e": "Anna 頭痛 headache。", "dialog": "<b>Mum:</b> What's the matter, Anna?<br><b>Anna:</b> I've got a bad headache."}, {"part": "Movers Listening Part 4｜Read and choose the picture.", "q": "What does Peter want to be?", "type": "mcq", "o": ["a doctor", "a pilot", "a farmer"], "a": 1, "e": "Peter 想當飛行員 pilot。", "dialog": "<b>Girl:</b> What do you want to be?<br><b>Peter:</b> A pilot. I love planes!"}, {"part": "Movers Listening Part 5｜Read and follow the instructions.", "q": "What colour must you make the boat?", "type": "mcq", "o": ["green", "yellow", "orange"], "a": 2, "e": "指示說把船塗成橘色 orange。", "dialog": "<b>Man:</b> Can you see the boat? Colour it orange, please.", "hint": "讀指示，選出正確的顏色或位置。"}, {"part": "Movers Listening Part 5｜Read and follow the instructions.", "q": "What colour must you make the bird?", "type": "mcq", "o": ["blue", "purple", "brown"], "a": 1, "e": "鳥要塗紫色 purple。", "dialog": "<b>Man:</b> Now find the bird in the tree and make it purple."}, {"part": "Movers Listening Part 5｜Read and follow the instructions.", "q": "Where must you write the word 'CAMP'?", "type": "mcq", "o": ["on the tent", "on the boat", "on the box"], "a": 0, "e": "字要寫在帳篷 tent 上。", "dialog": "<b>Man:</b> Write the word CAMP on the tent, please."}, {"part": "Movers Listening Part 5｜Read and follow the instructions.", "q": "Which animal must you colour grey?", "type": "mcq", "o": ["the horse", "the sheep", "the donkey"], "a": 2, "e": "要塗灰色的是驢子 donkey。", "dialog": "<b>Man:</b> Colour the donkey grey — not the horse!"}, {"part": "Movers Listening Part 5｜Read and follow the instructions.", "q": "What must you draw next to the tree?", "type": "mcq", "o": ["a ball", "a flower", "a bike"], "a": 1, "e": "要在樹旁邊畫一朵花 flower。", "dialog": "<b>Man:</b> Draw a flower next to the tree."}]}, {"id": "flyers", "title": "YLE A2 Flyers", "icon": "🥇", "desc": "劍橋兒童英語認證 第三級｜9–12 歲", "meta": "閱讀寫作 44 題 ＋ 聽力 25 題　共 69 題", "shield": true, "items": [{"part": "Flyers R&W Part 1｜Read the description and choose the word.", "q": "This person flies to the moon in a rocket.", "type": "mcq", "o": ["an astronaut", "a pilot", "a sailor"], "a": 0, "e": "搭火箭上月球的是 astronaut（太空人）。", "hint": "讀敘述，選出正確的單字。"}, {"part": "Flyers R&W Part 1｜Read the description and choose the word.", "q": "You use this to find out what words mean.", "type": "mcq", "o": ["a dictionary", "a diary", "a magazine"], "a": 0, "e": "查單字意思用 dictionary（字典）。"}, {"part": "Flyers R&W Part 1｜Read the description and choose the word.", "q": "This is the room where you cook food.", "type": "mcq", "o": ["a kitchen", "a hall", "a basement"], "a": 0, "e": "煮飯的房間是 kitchen。"}, {"part": "Flyers R&W Part 1｜Read the description and choose the word.", "q": "This weather is very windy and dangerous.", "type": "mcq", "o": ["a rainbow", "a storm", "a shadow"], "a": 1, "e": "又大風又危險的天氣是 storm（暴風雨）。"}, {"part": "Flyers R&W Part 1｜Read the description and choose the word.", "q": "You wear these to see better.", "type": "mcq", "o": ["glasses", "gloves", "sandals"], "a": 0, "e": "幫助看清楚的是 glasses（眼鏡）。"}, {"part": "Flyers R&W Part 1｜Read the description and choose the word.", "q": "This person looks after animals when they are ill.", "type": "mcq", "o": ["a vet", "a farmer", "a chef"], "a": 0, "e": "照顧生病動物的是 vet（獸醫）。"}, {"part": "Flyers R&W Part 1｜Read the description and choose the word.", "q": "You climb this to get to the top of a mountain.", "type": "mcq", "o": ["a path", "a bridge", "a tunnel"], "a": 0, "e": "爬上山用的是 path（小徑）。"}, {"part": "Flyers R&W Part 1｜Read the description and choose the word.", "q": "This is a large area of water with salt in it.", "type": "mcq", "o": ["a lake", "an ocean", "a pool"], "a": 1, "e": "有鹽分的大片水域是 ocean（海洋）。"}, {"part": "Flyers R&W Part 1｜Read the description and choose the word.", "q": "You send this to someone when you are on holiday.", "type": "mcq", "o": ["a postcard", "a passport", "a poster"], "a": 0, "e": "度假時寄給別人的是 postcard（明信片）。"}, {"part": "Flyers R&W Part 1｜Read the description and choose the word.", "q": "This is the meal you eat in the middle of the day.", "type": "mcq", "o": ["breakfast", "lunch", "supper"], "a": 1, "e": "中午吃的是 lunch。"}, {"part": "Flyers R&W Part 2｜Choose the best answer in the conversation.", "q": "Katy: Do all the people in your office work every day?", "type": "mcq", "o": ["Only a few. It's a small business.", "Yes, everyone did this time.", "I take the bus if it's raining."], "a": 0, "e": "問人數，回答 Only a few（只有幾個）。", "hint": "讀對話，選出最適合的回答。"}, {"part": "Flyers R&W Part 2｜Choose the best answer in the conversation.", "q": "Katy: How do you get to work, Aunt Emma?", "type": "mcq", "o": ["Yes it is, I don't want to be late.", "I take the bus if it's raining.", "Only a few, it's small."], "a": 1, "e": "問交通方式，回答搭公車。"}, {"part": "Flyers R&W Part 2｜Choose the best answer in the conversation.", "q": "Katy: Can I use your computer?", "type": "mcq", "o": ["OK, but only when I'm in a meeting.", "No, I didn't see it.", "It was very expensive."], "a": 0, "e": "回答允許使用，但加上條件。"}, {"part": "Flyers R&W Part 2｜Choose the best answer in the conversation.", "q": "Katy: Is it a long way to your office?", "type": "mcq", "o": ["I went yesterday.", "No, only ten minutes on foot.", "They are very busy."], "a": 1, "e": "問距離遠不遠，回答走路十分鐘。"}, {"part": "Flyers R&W Part 2｜Choose the best answer in the conversation.", "q": "Katy: What time do you finish work?", "type": "mcq", "o": ["At half past five, usually.", "In the city centre.", "By train."], "a": 0, "e": const KEYS = ["A","B","C","D"];
const $ = id => document.getElementById(id);
const BLOCK = 10;

let L = null, active = [], blocks = [], bi = 0, pos = 0, answers = [], mode = "quiz";
let fixQueue = [], fixPos = 0, blockScores = [], partName = null, partDone = {};

/* ---------- 首頁 ---------- */
function buildHome(){
  const box = $("levelList"); box.innerHTML = "";
  LEVELS.forEach((lv, i) => {
    const b = document.createElement("button");
    b.className = "lvl";
    b.innerHTML = '<span class="ico">'+lv.icon+'</span><span><span class="t">'+lv.title+'</span>'
                + '<span class="d">'+lv.desc+'</span><span class="m">'+lv.meta+'</span></span>';
    b.onclick = () => openLevel(i);
    box.appendChild(b);
  });
}
function show(box){
  ["homeBox","partBox","quizBox","resultBox","finalBox"].forEach(b => $(b).classList.toggle("hide", b !== box));
}
function goHome(){
  L = null; partName = null;
  $("pageTitle").textContent = "📚 英文能力檢定";
  $("pageSub").textContent = "選一個程度開始練習";
  show("homeBox");
}

/* ---------- 選擇級別 ---------- */
function openLevel(i){
  L = LEVELS[i];
  $("pageTitle").textContent = L.icon + " " + L.title;
  $("pageSub").textContent = L.meta;
  if (L.parts) buildPartMenu(); else startRange(L.items, null);
}

/* 取出所有單元名稱（依原順序） */
function partNames(){
  const seen = [], out = [];
  L.items.forEach(it => { if (!seen.includes(it.part)){ seen.push(it.part); out.push(it.part); } });
  return out;
}
function buildPartMenu(){
  const names = partNames();
  const box = $("partList"); box.innerHTML = "";
  names.forEach((nm, k) => {
    const n = L.items.filter(it => it.part === nm).length;
    const label = nm.split("｜");
    const done = (partDone[L.id] || {})[nm];
    const b = document.createElement("button");
    b.className = "prt" + (done !== undefined ? " done" : "");
    b.innerHTML = '<span class="n">'+(k+1)+'</span><span><span class="t">'+(label[1]||label[0])+'</span>'
                + '<span class="s">'+n+' 題</span></span>'
                + (done !== undefined ? '<span class="sc">'+done+' 分</span>' : '');
    b.onclick = () => startRange(L.items.filter(it => it.part === nm), nm);
    box.appendChild(b);
  });
  $("pageSub").textContent = "選一個單元開始，或從頭做完 100 題";
  show("partBox");
}

/* ---------- 開始作答 ---------- */
function startRange(list, nm){
  active = list; partName = nm;
  blocks = [];
  for (let s = 0; s < active.length; s += BLOCK)
    blocks.push({from:s, to:Math.min(s+BLOCK, active.length)});
  bi = 0; blockScores = [];
  startBlock();
}
function startBlock(){
  pos = 0; answers = []; mode = "quiz";
  show("quizBox"); render();
}
function blk(){ return blocks[bi]; }
function blkItems(){ return active.slice(blk().from, blk().to); }
function curIdx(){ return mode === "quiz" ? pos : fixQueue[fixPos]; }
function backTarget(){ if (L && L.parts) buildPartMenu(); else goHome(); }

/* ---------- 出題 ---------- */
function render(){
  const list = blkItems(), idx = curIdx(), it = list[idx];
  $("blockLabel").textContent = (blocks.length > 1 ? "第 " + (bi+1) + " 組 / 共 " + blocks.length + " 組"
                                                  : (partName ? "單元練習" : "測驗中"))
                              + (mode === "fix" ? "（訂正）" : "");
  $("countLabel").textContent = mode === "quiz" ? (pos+1)+" / "+list.length
                              : "訂正 "+(fixPos+1)+" / "+fixQueue.length;
  const p = mode === "quiz" ? pos/list.length : fixPos/fixQueue.length;
  $("barFill").style.width = (p*100)+"%";
  $("partbox").innerHTML = "<b>"+it.part+"</b>" + (it.hint ? "<i>"+it.hint+"</i>" : "");
  $("visual").innerHTML = it.scene || "";
  $("qno").textContent = "第 " + (blk().from + idx + 1) + " 題" + (mode==="fix" ? "（再試一次）" : "");

  let body = "";
  if (it.pic) body += '<div class="bigpic">'+it.pic+'</div>';
  if (it.dialog) body += '<div class="dialog">'+it.dialog+'</div>';
  if (it.scramble) body += '<div class="scramble">'+it.scramble+'</div>';
  if (it.q) body += '<div class="qtext">'+it.q+'</div>';
  $("qbody").innerHTML = body;

  const area = $("answerArea"); area.innerHTML = "";
  $("hint").className = "hint"; $("hint").innerHTML = "";
  $("nextBtn").classList.add("hide");

  if (it.type === "input"){
    const row = document.createElement("div");
    row.className = "inputrow";
    row.innerHTML = '<input id="ansInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="打出英文答案">'
                  + '<button class="act" id="sendBtn">送出</button>';
    area.appendChild(row);
    $("sendBtn").onclick = () => checkInput(it, idx);
    $("ansInput").addEventListener("keydown", e => { if (e.key === "Enter") checkInput(it, idx); });
    setTimeout(()=>$("ansInput").focus(), 60);
  } else {
    const opts = it.type === "tf" ? ["✔","✘"] : it.type === "yn" ? ["yes","no"] : it.o;
    const box = document.createElement("div");
    box.className = "opts" + (opts.length === 2 ? " two" : "");
    opts.forEach((t,k)=>{
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = (opts.length===2 ? "" : '<span class="k">'+KEYS[k]+'</span>') + "<span>"+t+"</span>";
      b.onclick = () => pick(k, it, idx, b, box);
      box.appendChild(b);
    });
    area.appendChild(box);
  }
}

function correctText(it){
  if (it.type === "input") return it.ans[0];
  if (it.type === "tf") return it.a === 0 ? "✔（對）" : "✘（錯）";
  if (it.type === "yn") return it.a === 0 ? "yes" : "no";
  return "(" + KEYS[it.a] + ") " + it.o[it.a];
}
function afterAnswer(ok, it){
  const h = $("hint");
  h.className = "hint show " + (ok ? "good" : "bad");
  h.innerHTML = ok ? "✅ 答對了！<br>"+it.e : "❌ 正確答案是 <b>"+correctText(it)+"</b><br>"+it.e;
  $("nextBtn").classList.remove("hide");
  $("nextBtn").textContent = (fixPos+1 >= fixQueue.length) ? "完成訂正 ▶" : "下一題 ▶";
}
function pick(k, it, idx, btn, box){
  if (mode === "quiz"){
    answers[idx] = k;
    [...box.children].forEach(b => b.disabled = true);
    btn.style.borderColor = "#4a7fc1";
    setTimeout(()=>{ pos++; pos >= blkItems().length ? finishBlock() : render(); }, 200);
  } else {
    [...box.children].forEach(b => b.disabled = true);
    if (k === it.a){ btn.classList.add("ok"); afterAnswer(true, it); }
    else { btn.classList.add("no"); box.children[it.a].classList.add("ok"); afterAnswer(false, it); }
  }
}
function checkInput(it, idx){
  const el = $("ansInput"), val = el.value.trim().toLowerCase().replace(/\s+/g," ");
  if (!val) return;
  const ok = it.ans.map(s=>s.toLowerCase()).includes(val);
  el.disabled = true; $("sendBtn").disabled = true;
  el.className = ok ? "ok" : "no";
  if (mode === "quiz"){
    answers[idx] = ok ? "OK" : val;
    setTimeout(()=>{ pos++; pos >= blkItems().length ? finishBlock() : render(); }, 300);
  } else afterAnswer(ok, it);
}
function isRight(it, ans){ return it.type === "input" ? ans === "OK" : ans === it.a; }

/* ---------- 每 10 題結算 ---------- */
function finishBlock(){
  const list = blkItems();
  let right = 0;
  list.forEach((it,i)=>{ if (isRight(it, answers[i])) right++; });
  const score = Math.round(right / list.length * 100);
  blockScores[bi] = {right:right, total:list.length, score:score};

  $("blockDone").textContent = blocks.length > 1
      ? "第 " + (bi+1) + " 組完成（第 " + (blk().from+1) + "–" + blk().to + " 題）"
      : (partName ? partName.split("｜").pop() + " 完成" : "測驗完成");
  $("scoreText").innerHTML = (right*10) + '<small> 分　（' + right + ' / ' + list.length + ' 題答對）</small>';
  const cm = ["這一組再多練幾次，你會越來越熟！","有幾題不太確定，訂正一下就懂了。",
              "不錯喔，大部分都答對了。","很棒！只差一點點就滿分。","太厲害了，幾乎全對！"];
  const ci = score<40?0:score<55?1:score<70?2:score<85?3:4;
  $("comment").textContent = cm[ci];

  const grid = $("grid"); grid.innerHTML = "";
  list.forEach((it,i)=>{
    const ok = isRight(it, answers[i]);
    const d = document.createElement("div");
    d.className = "cell " + (ok ? "ok" : "no");
    d.innerHTML = (ok?"✓":"✗") + "<span>" + (blk().from+i+1) + "</span>";
    grid.appendChild(d);
  });

  fixQueue = [];
  list.forEach((it,i)=>{ if (!isRight(it, answers[i])) fixQueue.push(i); });

  const row = $("resultRow"); row.innerHTML = "";
  const b = document.createElement("button"); b.className = "act";
  if (fixQueue.length){ b.textContent = "✏️ 訂正錯的 "+fixQueue.length+" 題"; b.onclick = startFix; }
  else { b.textContent = bi < blocks.length-1 ? "下一組 ▶" : "看總成績 ▶"; b.onclick = nextBlock; }
  row.appendChild(b);
  show("resultBox");
}
function startFix(){ mode = "fix"; fixPos = 0; show("quizBox"); render(); }
$("nextBtn").onclick = () => {
  fixPos++;
  if (fixPos >= fixQueue.length){
    mode = "quiz";
    const row = $("resultRow"); row.innerHTML = "";
    const b = document.createElement("button"); b.className = "act";
    b.textContent = bi < blocks.length-1 ? "下一組 ▶" : "看總成績 ▶";
    b.onclick = nextBlock; row.appendChild(b);
    $("comment").textContent = "訂正完成！記得剛剛學到的規則喔。";
    show("resultBox");
  } else render();
};
function nextBlock(){
  bi++;
  if (bi >= blocks.length){ showFinal(); return; }
  startBlock();
}

/* ---------- 總成績 ---------- */
function showFinal(){
  const tr = blockScores.reduce((a,b)=>a+b.right,0);
  const tt = blockScores.reduce((a,b)=>a+b.total,0);
  const pct = Math.round(tr/tt*100);
  if (partName){
    partDone[L.id] = partDone[L.id] || {};
    const old = partDone[L.id][partName];
    if (old === undefined || pct > old) partDone[L.id][partName] = pct;
  }
  $("finalScore").innerHTML = pct + '<small> 分　（' + tr + ' / ' + tt + ' 題）</small>';
  if (L.shield){
    const sh = pct<40?1:pct<55?2:pct<70?3:pct<85?4:5;
    $("finalShields").textContent = "🛡️".repeat(sh) + "▫️".repeat(5-sh);
  } else $("finalShields").textContent = "";
  $("finalList").innerHTML = blocks.length > 1
      ? blockScores.map((s,i)=>"・第 " + (i+1) + " 組：<b>" + (s.right*10) + " 分</b>（" + s.right + "/" + s.total + "）").join("<br>")
      : "";
  $("backPartBtn").classList.toggle("hide", !(L && L.parts));
  show("finalBox");
}

$("againBtn").onclick = () => startRange(active, partName);
$("backPartBtn").onclick = buildPartMenu;
$("homeBtn").onclick = goHome;
$("quitBtn").onclick = backTarget;
$("quitBtn2").onclick = backTarget;
$("quitBtn0").onclick = goHome;
$("allBtn").onclick = () => startRange(L.items, null);

buildHome();
goHome();
</script>
</body>
</html>
